services:
  - type: web
    name: barak-valley-connect
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: barak-valley-connect-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_OPERATOR_NAME
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: REQUEST_RETENTION_DAYS
        sync: false

databases:
  - name: barak-valley-connect-postgres
    databaseName: barak_valley_connect
    user: barak_valley_connect
    region: singapore
    ipAllowList: []

